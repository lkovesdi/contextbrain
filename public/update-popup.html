<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update ready</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .card {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: #1b1c22;
        color: #f2f1ed;
        border: none;
        text-align: left;
        cursor: pointer;
        transition: background 120ms ease;
      }
      .card:hover { background: #20212a; }
      .icon {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: rgba(75, 73, 230, 0.16);
        color: #8f8dff;
      }
      .mid { flex: 1 1 auto; min-width: 0; }
      .title { font-size: 14px; font-weight: 600; line-height: 1.2; }
      .ver { margin-top: 1px; font-size: 11.5px; color: #8b8c92; }
      .arrow { flex: 0 0 auto; color: #8b8c92; transition: transform 120ms ease, color 120ms ease; }
      .card:hover .arrow { color: #f2f1ed; transform: translateX(2px); }
    </style>
  </head>
  <body>
    <button class="card" id="relaunch" type="button">
      <span class="icon" aria-hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
        </svg>
      </span>
      <span class="mid">
        <span class="title">Relaunch to update</span>
        <span class="ver" id="ver">A new version is ready</span>
      </span>
      <span class="arrow" aria-hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M13 5l7 7-7 7" /></svg>
      </span>
    </button>
    <script>
      function invoke(cmd) {
        if (window.__TAURI__ && window.__TAURI__.core) {
          return window.__TAURI__.core.invoke(cmd);
        }
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, {});
        }
        return Promise.reject(new Error("Tauri bridge unavailable"));
      }
      // Show the staged version, if the command reports one.
      Promise.resolve(invoke("pending_update_version"))
        .then(function (v) {
          if (v) document.getElementById("ver").textContent = "v" + v;
        })
        .catch(function () {});
      document.getElementById("relaunch").addEventListener("click", function () {
        invoke("restart_app");
      });
    </script>
  </body>
</html>
