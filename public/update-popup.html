<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update ready</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .card {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: #1b1c22;
        color: #f2f1ed;
      }
      .close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 22px;
        height: 22px;
        display: grid;
        place-content: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #8b8c92;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .close:hover { background: rgba(255, 255, 255, 0.08); color: #f2f1ed; }
      .head { display: flex; align-items: center; gap: 11px; padding-right: 26px; }
      .icon {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: rgba(75, 73, 230, 0.16);
        color: #8f8dff;
      }
      .title { font-size: 14px; font-weight: 600; line-height: 1.2; }
      .ver { margin-top: 1px; font-size: 11.5px; color: #8b8c92; }
      .notes {
        flex: 1 1 auto;
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #c9cbd4;
        user-select: text;
        cursor: auto;
      }
      .notes h4 {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #8b8c92;
        margin: 4px 0 6px;
      }
      .notes ul { list-style: none; }
      .notes li {
        position: relative;
        padding-left: 14px;
        margin-bottom: 5px;
      }
      .notes li::before {
        content: "";
        position: absolute;
        left: 1px;
        top: 7px;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #4b49e6;
      }
      .notes p { margin-bottom: 6px; }
      .btn {
        flex: 0 0 auto;
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 9px;
        background: #4b49e6;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms ease;
      }
      .btn:hover { background: #3835d4; }
      .btn:active { background: #2a28b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <button class="close" id="dismiss" type="button" aria-label="Not now" title="Not now">✕</button>
      <div class="head">
        <span class="icon" aria-hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
          </svg>
        </span>
        <span>
          <span class="title">Update ready</span>
          <div class="ver" id="ver">A new version is staged</div>
        </span>
      </div>
      <div class="notes" id="notes"><p>Loading what&rsquo;s new&hellip;</p></div>
      <button class="btn" id="relaunch" type="button">Relaunch to update</button>
    </div>
    <script>
      function invoke(cmd) {
        if (window.__TAURI__ && window.__TAURI__.core) {
          return window.__TAURI__.core.invoke(cmd);
        }
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, {});
        }
        return Promise.reject(new Error("Tauri bridge unavailable"));
      }

      Promise.resolve(invoke("pending_update_version"))
        .then(function (v) {
          if (v) document.getElementById("ver").textContent = "v" + v + " — applies on relaunch";
        })
        .catch(function () {});

      // Render the release body (markdown-ish) as headings, bullets, and
      // paragraphs. Text nodes only — no HTML from the network is injected.
      Promise.resolve(invoke("pending_update_notes"))
        .then(function (notes) {
          var box = document.getElementById("notes");
          box.textContent = "";
          if (!notes) {
            var p = document.createElement("p");
            p.textContent = "Bug fixes and improvements.";
            box.appendChild(p);
            return;
          }
          var list = null;
          notes.split(/\r?\n/).forEach(function (raw) {
            var line = raw.trim();
            if (!line) { list = null; return; }
            if (/^#{1,6}\s/.test(line)) {
              var h = document.createElement("h4");
              h.textContent = line.replace(/^#{1,6}\s+/, "");
              box.appendChild(h);
              list = null;
            } else if (/^[-*]\s/.test(line)) {
              if (!list) { list = document.createElement("ul"); box.appendChild(list); }
              var li = document.createElement("li");
              li.textContent = line.replace(/^[-*]\s+/, "");
              list.appendChild(li);
            } else {
              var para = document.createElement("p");
              para.textContent = line;
              box.appendChild(para);
              list = null;
            }
          });
        })
        .catch(function () {});

      document.getElementById("relaunch").addEventListener("click", function () {
        invoke("restart_app");
      });
      document.getElementById("dismiss").addEventListener("click", function () {
        invoke("dismiss_update_popup");
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") invoke("dismiss_update_popup");
      });
    </script>
  </body>
</html>
