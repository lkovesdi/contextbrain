[package]
name = "contextbrain"
version = "0.2.6"
description = "ContextBrain desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "contextbrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed for the transparent floating recording widget
# window (WKWebView transparency is a private API behind this flag).
tauri = { version = "2", features = ["macos-private-api"] }
# Captures `contextbrain://...` callback URLs after Supabase / Composio
# magic-link redirects. Wired into the renderer in Phase 2.
tauri-plugin-deep-link = "2"
# OTA updater for desktop builds. Manifest lives on a GitHub Release asset;
# signing key is project-scoped, not Apple's.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: the window uses titleBarStyle "Overlay" (seamless — web content
# under the traffic lights). That removes the native titlebar drag area, so we
# add a transparent native NSView drag strip across the top (see lib.rs). All of
# this is already in the tree as transitive Tauri deps, so no new compile cost.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSResponder", "NSWindow", "NSEvent", "NSPanel", "objc2-core-foundation"] }

[features]
default = ["custom-protocol"]
# Lets Tauri serve embedded assets via a custom scheme in production builds.
custom-protocol = ["tauri/custom-protocol"]
