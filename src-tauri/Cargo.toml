[package]
name = "meetingbrain"
version = "0.1.0"
description = "MeetingBrain desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "meetingbrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Captures `meetingbrain://...` callback URLs after Supabase / Composio
# magic-link redirects. Wired into the renderer in Phase 2.
tauri-plugin-deep-link = "2"
# OTA updater for desktop builds. Manifest lives on a GitHub Release asset;
# signing key is project-scoped, not Apple's.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
# Lets Tauri serve embedded assets via a custom scheme in production builds.
custom-protocol = ["tauri/custom-protocol"]
